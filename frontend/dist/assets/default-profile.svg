<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e7f5ea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c7f0dd;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="200" height="200" fill="url(#bgGradient)"/>
  
  <!-- Head -->
  <circle cx="100" cy="70" r="28" fill="#16a34a" opacity="0.8"/>
  
  <!-- Body -->
  <path d="M 72 95 Q 72 98 75 98 L 125 98 Q 128 98 128 95 L 128 110 Q 128 112 126 112 L 74 112 Q 72 112 72 110 Z" fill="#16a34a" opacity="0.8"/>
  
  <!-- Shoulders/neck connector -->
