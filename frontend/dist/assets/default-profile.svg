  <!-- Placeholder text -->
  <text x="100" y="155" text-anchor="middle" font-size="12" fill="#15803d" font-weight="500" opacity="0.8">Profile Photo</text>
  <text x="100" y="172" text-anchor="middle" font-size="10" fill="#10b981" font-weight="400" opacity="0.7">Click to upload</text>
  
  <!-- Subtle camera icon overlay -->
  <g opacity="0.5">
    <circle cx="165" cy="155" r="18" fill="white" stroke="#16a34a" stroke-width="1.5"/>
    <circle cx="165" cy="155" r="10" fill="none" stroke="#16a34a" stroke-width="1.5"/>
